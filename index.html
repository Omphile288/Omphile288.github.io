<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183f2a">
    <title>FarmersHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f5f7f1;
            color: #203329;
            font-family: 'DM Sans', Arial, sans-serif;
        }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 40px auto;
            padding: 0;
            overflow: hidden;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px #183f2a1b;
        }

        .hero {
            display: flex;
            min-height: 490px;
            align-items: center;
            padding: 54px 7%;
            color: #fff;
            background:
                linear-gradient(
                    90deg,
                    rgba(15, 43, 29, .88),
                    rgba(15, 43, 29, .47) 58%,
                    rgba(15, 43, 29, .12)
                ),
                url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1900&q=85')
                center 52% / cover;
        }

        .hero-copy {
            max-width: 570px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 18px;
            padding: 8px 13px;
            border: 1px solid #ffffff65;
            border-radius: 99px;
            background: #ffffff18;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #fff;
            font: 800 clamp(42px, 7vw, 76px) / 1.02 Manrope, Arial, sans-serif;
            letter-spacing: -.055em;
        }

        .hero h2 {
            margin: 20px 0 12px;
            color: #e0f2cf;
            font: 700 22px Manrope, Arial, sans-serif;
        }

        .hero p {
            max-width: 470px;
            margin: 0;
            color: #f2f6ed;
            font-size: 17px;
            line-height: 1.7;
        }

        .choice {
            padding: 30px 7% 36px;
            text-align: center;
        }

        .choice-title {
            margin: 0 0 21px;
            color: #53665a;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .actions .action-button {
            display: inline-block;
            min-width: 190px;
            padding: 15px 25px;
            border: 0;
            border-radius: 12px;
            background: #23643c;
            box-shadow: 0 8px 18px #23643c26;
            color: #fff;
            cursor: pointer;
            font: 700 15px 'DM Sans', Arial, sans-serif;
            letter-spacing: .045em;
            text-align: center;
            text-decoration: none;
            transition:
                transform .18s,
                background .18s,
                box-shadow .18s;
        }

        .actions a:first-child {
            background: #e9f2e6;
            box-shadow: inset 0 0 0 1px #cbdcc8;
            color: #245537;
        }

        .actions .action-button:hover {
            transform: translateY(-2px);
            background: #17492d;
            box-shadow: 0 12px 22px #183f2a2c;
        }

        .actions a:first-child:hover {
            background: #dcebd8;
            color: #17492d;
        }

        .actions .action-button:focus-visible {
            outline: 3px solid #89c995;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 22px);
                margin: 11px auto;
                border-radius: 18px;
            }

            .hero {
                min-height: 430px;
                padding: 36px 25px;
                background-position: 58% center;
            }

            .hero p {
                font-size: 15px;
            }

            .choice {
                padding: 25px 20px 30px;
            }

            .actions {
                flex-direction: column;
            }

            .actions a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Grown with care · Shared with community</p>
                <h1>FarmersHub</h1>
                <h2>Fresh from local farms to your table.</h2>
                <p>
                    Connect with the people who grow your food. Shop seasonal
                    produce or bring your harvest to a community that values it.
                </p>
            </div>
        </section>

        <section class="choice" aria-labelledby="choice-title">
            <p class="choice-title" id="choice-title">How would you like to join?</p>
            <nav class="actions" aria-label="Choose an account type">
                <a class="action-button" href="Buyer Registration - FarmersHub.html">
                    Customer
                </a>
                <a class="action-button" href="Farmer Registration - FarmersHub.html">
                    Farmer
                </a>
            </nav>
        </section>
    </main>
</body>
</html>
