<!doctype html><html lang="en"><head><title>FarmersHub</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183f2a"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7f1;color:#203329;font-family:'DM Sans',Arial,sans-serif}.container{width:min(1100px,calc(100% - 40px));margin:40px auto;padding:0;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #183f2a1b}.hero{min-height:490px;padding:54px 7%;display:flex;align-items:center;color:white;background:linear-gradient(90deg,rgba(15,43,29,.88),rgba(15,43,29,.47) 58%,rgba(15,43,29,.12)),url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1900&q=85') center 52%/cover}.hero-copy{max-width:570px}.eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:8px 13px;border:1px solid #ffffff65;border-radius:99px;background:#ffffff18;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:#fff;font:800 clamp(42px,7vw,76px)/1.02 Manrope,Arial,sans-serif;letter-spacing:-.055em}.hero h2{margin:20px 0 12px;color:#e0f2cf;font:700 22px Manrope,Arial,sans-serif}.hero p{max-width:470px;margin:0;color:#f2f6ed;font-size:17px;line-height:1.7}.choice{padding:30px 7% 36px;text-align:center}.choice-title{margin:0 0 21px;color:#53665a;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.actions a{text-decoration:none}.actions button{min-width:190px;border:0;border-radius:12px;padding:15px 25px;background:#23643c;color:#fff;font:700 15px 'DM Sans',Arial,sans-serif;letter-spacing:.045em;cursor:pointer;box-shadow:0 8px 18px #23643c26;transition:transform .18s,background .18s,box-shadow .18s}.actions a:first-child button{background:#e9f2e6;color:#245537;box-shadow:inset 0 0 0 1px #cbdcc8}.actions button:hover{transform:translateY(-2px);background:#17492d;box-shadow:0 12px 22px #183f2a2c}.actions a:first-child button:hover{background:#dcebd8;color:#17492d}#message{color:#ae3333;font-weight:700;margin:14px 0 0}@media(max-width:600px){.container{width:calc(100% - 22px);margin:11px auto;border-radius:18px}.hero{min-height:430px;padding:36px 25px;background-position:58% center}.hero p{font-size:15px}.choice{padding:25px 20px 30px}.actions{flex-direction:column}.actions a,.actions button{width:100%}}</style></head><body><main class="container"><section class="hero"><div class="hero-copy"><p class="eyebrow">Grown with care · Shared with community</p><h1>FarmersHub</h1><h2>Fresh from local farms to your table.</h2><p>Connect with the people who grow your food. Shop seasonal produce or bring your harvest to a community that values it.</p></div></section><section class="choice"><p class="choice-title">How would you like to join?</p><div class="actions"><a href="Buyer Registration - FarmersHub.html"><button>CUSTOMER</button></a><a href="Farmer Registration - FarmersHub.html"><button>FARMER</button></a></div><p id="message"></p></section></main><script>

function continueToNextPage()
{

    if(document.getElementById("farmer").checked)
    {

        window.location.href = "farmer.html";

    }

    else if(document.getElementById("buyer").checked)
    {

        window.location.href = "buyer.html";

    }

    else
    {

        document.getElementById("message").innerHTML =
        "Invalid option selected.<br>Please restart and select Farmer or Buyer.";

    }

}

</script>

</body>

</html>
