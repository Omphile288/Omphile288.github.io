<body>

<div class="container"><header class="page-banner"><p class="eyebrow">Join the FarmersHub network</p><h1>Farmer Registration</h1><p>Share your farm details and connect your harvest with local customers.</p></header>



<table class="form-table">

<tr>
<td>Farmer Name</td>
<td>
<input type="text" id="farmerName">
</td>
</tr>

<tr>
<td>Farm Location</td>
<td>
<input type="text" id="farmLocation">
</td>
</tr>

<tr>
<td>Phone Number / Email</td>
<td>
<input type="text" id="contact">
</td>
</tr>

</table>

<br>

<div class="form-actions"><button class="home-button"><a href="index.html">Home</a></button><button onclick="registerFarmer()">Register</button></div>

<div id="output"></div>

</div>

<script>

function registerFarmer()
{

    var nameOfTheFarmer =
    document.getElementById("farmerName").value;

    var farmLocation =
    document.getElementById("farmLocation").value;

    var farmerContactDetails =
    document.getElementById("contact").value;

    if(nameOfTheFarmer=="" ||
       farmLocation=="" ||
       farmerContactDetails=="")
    {

        alert("Please complete all the fields.");

        return;

    }

    var farmerID =
    "FARMER-" +
    Math.floor(Math.random()*9000+1000);

    var SUBSCRIPTION_FEE = 50.00;

    document.getElementById("output").style.display="block";

    document.getElementById("output").innerHTML=

    "<h2>Registration Successful!</h2>" +

    "<p><b>Farmer ID:</b> " +
    farmerID +
    "</p>" +

    "<p><b>Farmer Name:</b> " +
    nameOfTheFarmer +
    "</p>" +

    "<p><b>Farm Location:</b> " +
    farmLocation +
    "</p>" +

    "<p><b>Contact Details:</b> " +
    farmerContactDetails +
    "</p>" +

    "<p><b>Monthly Intermediary Subscription Fee Due:</b> R" +
    SUBSCRIPTION_FEE.toFixed(2) +
    "</p>";

}

</script>

</body>
